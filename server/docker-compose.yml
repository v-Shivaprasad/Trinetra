version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: "host"
    container_name: server
    ports:
      - "3001:3001"
    volumes:
      - .:/server
      - /server/node_modules
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:


